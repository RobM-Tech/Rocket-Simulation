name: Sim Testing

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: python-version: '3.10'

      - run: |
          pip install uv
          uv venv
          uv pip install -e ".[dev]"
          uv run -m pytest